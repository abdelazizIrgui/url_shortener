<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LinkBlick — Free URL Shortener with QR Codes & Click Analytics</title>
    <meta
      name="description"
      content="Shorten long links in seconds, generate QR codes automatically, and track clicks by country, device, and referrer. Free to start, no credit card required."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.linkanalyse.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkBlick" />
    <meta property="og:title" content="LinkAnalyse — Free URL Shortener with QR Codes & Click Analytics" />
    <meta
      property="og:description"
      content="Shorten long links in seconds, generate QR codes automatically, and track clicks by country, device, and referrer. Free to start, no credit card required."
    />
    <meta property="og:url" content="www.linkanalyse.com" />
    <meta property="og:image" content="https://linkanalyse.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkAnalyse — Free URL Shortener with QR Codes & Click Analytics" />
    <meta
      name="twitter:description"
      content="Shorten long links in seconds, generate QR codes automatically, and track clicks by country, device, and referrer."
    />
    <meta name="twitter:image" content="https://linkanalyse.com/og-image.png" />

    <!-- hreflang: site supports en / ar / fr / es / de / zh via in-app language switcher -->
    <link rel="alternate" hreflang="en" href="https://linkanalyse.com/" />
    <link rel="alternate" hreflang="ar" href="https://linkanalyse.com/" />
    <link rel="alternate" hreflang="fr" href="https://linkanalyse.com/" />
    <link rel="alternate" hreflang="es" href="https://linkanalyse.com/" />
    <link rel="alternate" hreflang="de" href="https://linkanalyse.com/" />
    <link rel="alternate" hreflang="zh" href="https://linkanalyse.com/" />
    <link rel="alternate" hreflang="x-default" href="https://linkanalyse.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Set the theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: tells Google this is a web application, not an article -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LinkBlick",
        "url": "https://linkblick.com/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "description": "Free URL shortener with QR code generation and click analytics by country, device, and referrer.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
